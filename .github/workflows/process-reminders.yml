# Secure scheduler: GitHub OIDC, no stored secret
name: Process TravelEasto reminders

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/process-reminders.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: traveleasto-reminders
  cancel-in-progress: false

jobs:
  process-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process due reminders
        env:
          REMINDER_ENDPOINT: https://traveleasto-reminders.eilaimaman672.chatgpt.site/api/reminders/process
        run: |
          set -euo pipefail

          oidc_response="$(curl --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=traveleasto-reminders")"
          oidc_token="$(printf '%s' "${oidc_response}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${oidc_token}"

          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 30 \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --request POST \
            "${REMINDER_ENDPOINT}" \
            --header "Authorization: Bearer ${oidc_token}" \
            --header "Content-Type: application/json" \
            --data "{}")"

          cat "${response_file}"

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo
            echo "Reminder endpoint returned HTTP ${status}."
            exit 1
          fi
